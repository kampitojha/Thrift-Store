name: CD

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/thrift-store
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f

      - name: Smoke Test
        run: |
          sleep 15
          curl -sf https://staging.thriftstore.com/api/v1/health || exit 1
          curl -sf -o /dev/null -w "%{http_code}" https://staging.thriftstore.com | grep -q "200" || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://thriftstore.com
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/thrift-store
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f

      - name: Health Check
        run: |
          sleep 20
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://thriftstore.com 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: waiting for 200..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Tag Release
        run: |
          git tag v$(date +'%Y.%m.%d.%H%M')
          git push origin --tags

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Rollback to Previous Stable
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST || secrets.STAGING_HOST }}
          username: ${{ secrets.PROD_USER || secrets.STAGING_USER }}
          key: ${{ secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/thrift-store
            PREVIOUS_TAG=$(docker images --format '{{.Tag}}' | grep -v latest | sort -V | tail -2 | head -1)
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Rolling back to: $PREVIOUS_TAG"
              export IMAGE_TAG=$PREVIOUS_TAG
              docker compose up -d --force-recreate
            else
              echo "No previous version found for rollback"
              exit 1
            fi
